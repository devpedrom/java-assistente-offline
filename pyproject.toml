[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "java-assistente-offline"
version = "0.1.0"
description = "Assistente local para exercicios Java POO"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
java-assistente = "java_assistant.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

